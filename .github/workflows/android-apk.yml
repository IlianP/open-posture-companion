# Builds the standalone Android APK of this fork.
#
#   pull request     -> checks + APK as a run artifact, for testing before merge
#   push to main     -> checks + APK + a GitHub release with the APK attached
#   manual dispatch  -> same as a push, for the selected branch (release: main only)
#
# The latest release's APK is always available at
#   https://github.com/<owner>/<repo>/releases/latest/download/open-posture-companion.apk
#
# See FORK.md for the surrounding workflow.

name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit, so every script runs with `set -eo pipefail`.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # First, and independent of everything else: no change may reach a
      # build that writes to a characteristic outside the verified set.
      - name: BLE write-safety check
        run: node scripts/check-ble-write-safety.mjs

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Build release APK
        run: ./scripts/build-android.sh

      - name: Read build version
        id: meta
        run: |
          npx expo config --json | node -e '
            let json = "";
            process.stdin.on("data", (chunk) => (json += chunk)).on("end", () => {
              const config = JSON.parse(json);
              const { date, commit } = config.extra.forkBuild;
              console.log(`version=${config.version}`);
              console.log(`tag=android-${date}-${commit}`);
            });
          ' | tee -a "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          # Uploaded as-is (not zipped), so it can be downloaded straight
          # onto a phone; the artifact is named after the file.
          path: dist/open-posture-companion.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    # Only what has passed review and landed on main becomes a release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # v8 is the first version that can fetch an artifact uploaded as a
      # plain file (archive: false above); it is addressed by its file name.
      - uses: actions/download-artifact@v8
        with:
          name: open-posture-companion.apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          apk="$(find dist -name 'open-posture-companion.apk' -type f | head -n 1)"
          test -n "$apk"

          {
            echo "Standalone-APK (arm64) dieses Forks, gebaut aus ${GITHUB_SHA}."
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo
            echo "Installation und Update: siehe [FORK.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/FORK.md)."
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-run for a commit that already has its release.
            gh release upload "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Android ${VERSION}" \
              --notes-file notes.md \
              --generate-notes \
              --latest
          fi
